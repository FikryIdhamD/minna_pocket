# Build APK rilis (book1) otomatis. FILE INI DISEDIAKAN LENGKAP. JANGAN DIUBAH.
# Secrets yang dibutuhkan (GitHub → Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: build-apk
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Siapkan keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          PROPS
      - run: flutter build apk --release --flavor book1 -t lib/main/main_book1.dart
      - uses: actions/upload-artifact@v4
        with:
          name: minna-pocket-book1
          path: build/app/outputs/flutter-apk/app-book1-release.apk
