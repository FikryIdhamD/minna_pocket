# Minna Pocket — pubspec. FILE INI DISEDIAKAN LENGKAP. JANGAN DIUBAH dengan tangan.
# Daftar folder aset buku (di bagian akhir file) ditulis ulang oleh tools/gen_pubspec_assets.py.
name: minna_pocket
description: Minna no Nihongo Shokyu dalam saku (penggunaan pribadi).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  just_audio: ^0.9.46
  audio_session: ^0.1.25
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  flutter_svg: ^2.0.17
  flutter_tts: ^4.2.2
  http: ^1.3.0
  flutter_secure_storage: ^9.2.4
  file_picker: ^8.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Variable.ttf
    - family: KleeOne
      fonts:
        - asset: assets/fonts/KleeOne-SemiBold.ttf
          weight: 600
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf

  assets:
    - assets/icons/
    - assets/logo/logo_256.png
